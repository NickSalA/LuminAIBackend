name: Trigger auto deployment for container-lumin

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/container-lumin-AutoDeployTrigger-642e4dbf-b41f-4177-b333-7a8910a39897.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTAINERLUMIN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERLUMIN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERLUMIN_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: containerregistrylumin.azurecr.io
          registryUsername: ${{ secrets.CONTAINERLUMIN_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERLUMIN_REGISTRY_PASSWORD }}
          containerAppName: container-lumin
          resourceGroup: lumin
          imageToBuild: containerregistrylumin.azurecr.io/container-lumin:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


